[package]
name = "climcalc-core"
version = "0.5.0"
authors = ["Alexander Rathert (ALRA) <alex.rah@mailbox.org>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
console_error_panic_hook = { version = "0.1.7", optional = true }

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
approx = "0.5.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

